name: Web

# The checks that gate what customers actually see.
#
# Why this workflow exists: before it, CI ran nine checks and NONE of them
# built apps/web. Six were Python jobs for backend/, which Vercel does not
# deploy. That is how a client-component/metadata error reached production and
# sat there for four days while three Python versions were tested on every push.
#
# Order is deliberate — cheapest and most specific failure first:
#   guards (~5s) -> typecheck (~40s) -> build (~2min)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'
  # No `paths` filter on pull_request, deliberately: Guards, Typecheck & Build and
  # the PostgreSQL job are REQUIRED status checks on main. A path-filtered
  # workflow never reports on a PR that touches only other files, and a required
  # check that never reports blocks the merge forever. The push trigger keeps its
  # filter: nothing is required there.
  pull_request:
    branches: [main]

# A newer push makes an in-flight run irrelevant. Without this, queues pile up
# during a GitHub Actions incident and every stale run competes for a runner.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # THE ONE TOOL THESE GUARDS NEED THAT NODE DOES NOT SHIP.
      #
      # verify-business-facts.mjs reads the text of every PDF served from
      # public/ and looks for retired claims — a price band that changed, a
      # figure that was withdrawn. Eleven field catalogues are now published, so
      # eleven documents that a customer downloads and keeps are inside that
      # check.
      #
      # It fails rather than skips when pdftotext is absent, which is correct
      # and is also why this line exists: a guard that silently skips the file
      # it cannot read is how F-23 shipped, and a runner image that quietly
      # stops including poppler-utils would otherwise turn that failure into a
      # CI outage nobody could explain. Install it explicitly instead of
      # depending on what the image happens to carry.
      - name: pdftotext, for the PDF fact check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      # Every guard the repository has, derived from package.json rather than
      # from a list kept here, so a guard added to package.json gates this job
      # from its first commit with no second edit.
      - name: All guards (derived from package.json — nothing can be left out)
        run: node scripts/verify-all.mjs

  build:
    name: Typecheck & Build
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder values only. next build must not depend on real secrets — if a
    # value here has to become real for the build to pass, that is a bug worth
    # fixing rather than a secret worth adding.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=ecowoods
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=ecowoods
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
      NEXTAUTH_URL: https://ecowoods.ca
      NEXT_PUBLIC_SITE_URL: https://ecowoods.ca
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The one guard in scripts/verify-*.mjs that needs an installed
      # dependency (postcss, which Next already uses to compile globals.css —
      # see scripts/verify-css.mjs). The Guards job stays dependency-free by
      # design and skips this one specifically for that reason; this is where
      # it actually runs, now that node_modules exists.
      - name: CSS parses (postcss, the same parser that compiles it)
        run: node scripts/verify-css.mjs
      # Must precede tsc: the client is generated from schema.prisma, and
      # without it every model added since the last generate is a type error.
      - name: Generate Prisma client
        run: pnpm --filter @ecowoods/web exec prisma generate
      - name: Typecheck
        run: pnpm --filter @ecowoods/web exec tsc --noEmit
      # `next build --no-lint` is deliberate (lint would double the build time),
      # which means nothing else enforces it. Errors fail here; warnings are
      # reported but do not gate.
      - name: Lint (errors only; the build skips lint)
        run: pnpm --filter @ecowoods/web lint
      # In-process: the registry, the matcher and the /api/v1 handlers are
      # exercised with real Request objects and no server. Contract, negative,
      # invariant and drift suites — a fact that differs between two surfaces
      # fails here before the build spends two minutes on it.
      - name: Unit and contract tests
        run: pnpm --filter @ecowoods/web test
      - name: Production build
        run: pnpm --filter @ecowoods/web build

  appointment-postgres:
    name: Appointment capacity (PostgreSQL Serializable)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecowoods_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecowoods_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ecowoods_test?schema=ecowoods&connection_limit=20"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ecowoods_test?schema=ecowoods&connection_limit=20"
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @ecowoods/web exec prisma generate
      # Prove the committed migrations (what production runs) apply cleanly to
      # an EMPTY database and produce exactly the schema.prisma datamodel. The
      # tests below need the migrations' hand-written SQL (rate_limit_consume())
      # that `db push` cannot create, so the test database is built from them.
      - name: Create isolated PostgreSQL schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d ecowoods_test -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS ecowoods'
      - name: Apply migrations to an empty database (prisma migrate deploy)
        run: pnpm --filter @ecowoods/web exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Migrations match schema.prisma (no drift)
        run: pnpm --filter @ecowoods/web exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Run real PostgreSQL integration tests
        run: >-
          pnpm --filter @ecowoods/web exec vitest run --no-file-parallelism
          tests/appointments-capacity.postgres.integration.test.ts
          tests/credits-concurrency.postgres.integration.test.ts
          tests/schema-structure.postgres.integration.test.ts
          tests/credit-ledger.postgres.integration.test.ts
          tests/chat-booking.postgres.integration.test.ts
          tests/funnel-instrumentation.postgres.integration.test.ts
          tests/rate-limit.postgres.integration.test.ts
          tests/payment-followups.postgres.integration.test.ts
          tests/stripe-fulfillment.postgres.integration.test.ts
          tests/funnel-report.postgres.integration.test.ts
          tests/quote-accepted-event.postgres.integration.test.ts
          tests/order-confirmation-outbox.postgres.integration.test.ts
          tests/payment-refund-correlation.postgres.integration.test.ts
          tests/assistant-conversation.postgres.integration.test.ts
          tests/quote-recovery.postgres.integration.test.ts
          tests/commercial-lifecycle.postgres.integration.test.ts
          tests/payment-reconciliation.postgres.integration.test.ts
