name: Web

# The checks that gate what customers actually see.
#
# Why this workflow exists: before it, CI ran nine checks and NONE of them
# built apps/web. Six were Python jobs for backend/, which Vercel does not
# deploy. That is how a client-component/metadata error reached production and
# sat there for four days while three Python versions were tested on every push.
#
# Order is deliberate — cheapest and most specific failure first:
#   guards (~5s) -> typecheck (~40s) -> build (~2min)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'

# A newer push makes an in-flight run irrelevant. Without this, queues pile up
# during a GitHub Actions incident and every stale run competes for a runner.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # THE ONE TOOL THESE GUARDS NEED THAT NODE DOES NOT SHIP.
      #
      # verify-business-facts.mjs reads the text of every PDF served from
      # public/ and looks for retired claims — a price band that changed, a
      # figure that was withdrawn. Eleven field catalogues are now published, so
      # eleven documents that a customer downloads and keeps are inside that
      # check.
      #
      # It fails rather than skips when pdftotext is absent, which is correct
      # and is also why this line exists: a guard that silently skips the file
      # it cannot read is how F-23 shipped, and a runner image that quietly
      # stops including poppler-utils would otherwise turn that failure into a
      # CI outage nobody could explain. Install it explicitly instead of
      # depending on what the image happens to carry.
      - name: pdftotext, for the PDF fact check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      # Dependency-free and connectionless — runs in seconds, never flakes,
      # and fails before anyone waits on an install.
      - name: Business facts
        run: node scripts/verify-business-facts.mjs
      - name: Schema / migration drift
        run: node scripts/verify-migrations.mjs
      # The Floor Graph is the only asset here a competitor cannot copy off a
      # public repository, and it is also where a small well-meaning edit does
      # damage nothing else reports: an identifier in the publishable benchmark
      # table, a photograph whose consent row is optional, consent wording
      # edited in place, or a cascade added from a lead to a floor.
      - name: Floor Graph (consent ledger, benchmark anonymity, no cascade)
        run: node scripts/verify-floor-graph.mjs
      # Reachability and accessibility, checked as text in about a second each.
      # The runtime axe pass in audit/ is strictly better and needs Chromium, a
      # production build and four minutes — so it runs when somebody remembers,
      # which has been never. These two gate the failures that keep recurring:
      # a form control with no accessible name, and a route nobody can click to.
      - name: Accessibility contract (every control has a name, every click a key)
        run: node scripts/verify-a11y.mjs
      - name: Navigation (every public route within 3 clicks, chrome resolves)
        run: node scripts/verify-navigation.mjs
      # Photographic records: every registered plate is on disk, alt text
      # describes the room, and no private street address reaches a registry.
      - name: Media (plates on disk, alt present, no civic address)
        run: node scripts/verify-media.mjs
      # Every file under apps/web/public 404d in production for months because
      # Vercel takes its static root from the repository root. The build command
      # now syncs one into the other; this fails if that clause is removed.
      - name: Public assets (the static root is actually synced)
        run: node scripts/verify-public-assets.mjs
      # Specifications for machines other people manufacture. Every figure needs
      # an https source read within 400 days; no price and no productivity number
      # may appear, because no manufacturer in this category publishes either.
      - name: Equipment (sourced specs, no invented price or throughput)
        run: node scripts/verify-equipment.mjs
      # /quote-check compares scopes and prices nothing. Its one unacceptable
      # change — putting a dollar figure on a line item a quote leaves out — is
      # also its most obvious-looking improvement, and will arrive as a small
      # edit from someone who has not read s.74.01(1)(b). Checked mechanically.
      - name: Quote comparison (no price, no ranking, every citation resolves)
        run: node scripts/verify-quote-check.mjs
      # The live check runs against production and cannot be run from here. What
      # CAN be checked from here is whether its assertions are satisfiable at
      # all: it spent months asserting a phrase the generator had stopped
      # emitting, and it sent operators to a runbook that did not exist while
      # the old domain went on serving 200 on 35 URLs.
      - name: Live contract (the live check asserts things this repo can produce)
        run: node scripts/verify-live-contract.mjs
      # The geographic model is where a truthful site most easily stops being
      # one, and it happens by increments that each look reasonable: a
      # municipality joins a list, a template gives it a page, areaServed is
      # generated from the list, and the entity graph now says a Toronto company
      # serves six municipalities in New York State. Checked, not intended.
      - name: Geography (no claimed coverage without a dated confirmation)
        run: node scripts/verify-geo.mjs
      # Four endpoints on this site compute an answer. Before they were
      # registered as actions, every action here ended in a human — which is
      # exactly what an assistant learns from every competitor, and why it has
      # no reason to name one. A tool that is not discoverable as executable
      # gets described instead of used.
      - name: Answer-engine surface (every tool is discoverable as runnable)
        run: node scripts/verify-aeo.mjs
      # Eleven documents that leave the site. A broken page is a bad minute; a
      # catalogue that 404s from a link somebody forwarded is the company
      # failing in front of the person the reader was trying to convince — and
      # all eleven sat at the repository root, unserved, until they were moved.
      - name: Field catalogues (every listed document is a file the host serves)
        run: node scripts/verify-catalogues.mjs
      # Six funnels declare the event that ends them. A funnel whose completion
      # event exists only in the analytics union — declared, never emitted — is
      # a funnel that reports zero forever and reads as a dead product rather
      # than a missing call. This also holds the expansion scorecard to what it
      # can actually source: it must keep refusing the ten economic inputs the
      # business does not hold, rather than growing invented numbers for them.
      - name: Strategy (funnels complete, tracked questions resolve, no invented economics)
        run: node scripts/verify-strategy.mjs
      # The market score decides where the next page gets written and where the
      # budget goes. Eight of its ten inputs are census and keyword figures a
      # person could type from memory in four seconds, and a typed figure scores
      # identically to a sourced one right up to the season it sends the work to
      # the wrong municipality.
      - name: Market inputs (no score from a figure nobody can point at)
        run: node scripts/verify-market-inputs.mjs
      # 80% Canada, 20% western New York. Nobody violates that on purpose; it
      # goes one reasonable commit at a time until a Toronto contractor's site
      # reads as an American one. Underneath the ratio sits a line with no
      # tolerance at all: no United States market may hold an indexable page or
      # enter the service area, because there is no United States office.
      - name: Allocation (every published page is genuinely local)
        run: node scripts/verify-allocation.mjs
      # The cross-surface gate. Every other guard checks one surface; this one
      # checks that they agree, because the failure this repository has actually
      # shipped is not a broken page but two true-looking pages contradicting
      # each other, with a crawler resolving the contradiction against us.
      - name: Geo green gate (every published city is coherent across every surface)
        run: node scripts/verify-geo-green.mjs
      # ── search & retrieval gates ──────────────────────────────────────
      #
      # All four are dependency-free and connectionless, like the two above:
      # they parse the repository as text and finish in about a second each.
      # None of them fetches a URL, deliberately — a check that reaches the
      # network from CI is a check that reports a proxy's 403 as a broken site,
      # which this repository has recorded five times. The live half runs from a
      # machine with open egress: `pnpm seo:live`.
      #
      # Each is a separate step rather than one `pnpm seo`, because the step
      # name is what appears in the PR checks list — "Price source" failing
      # tells you what broke before you open the log.
      - name: Price source (one price, one file)
        run: node scripts/verify-pricing-source.mjs
      - name: Claim registry (no unregistered business fact ships)
        run: node scripts/verify-claims.mjs
      - name: Topic map (every canonical resolves, no redirect chains)
        run: node scripts/verify-topic-map.mjs
      - name: Link density (every commercial page reaches evidence and a CTA)
        run: node scripts/verify-link-density.mjs
      - name: Legal surface (every data processor is declared; /privacy and /terms exist)
        run: node scripts/verify-legal.mjs
      - name: Key handlers (no global shortcut can steal a keystroke)
        run: node scripts/verify-key-handlers.mjs
      - name: Assistant (one name, and the prompt still closes on Ecowoods)
        run: node scripts/verify-assistant.mjs
      - name: AI discoverability (commercial material leads every machine surface)
        run: node scripts/audit-ai-discoverability.mjs
      # The /api/v1 contract, checked as text: every declared endpoint has a
      # route and every route is declared; no instruction-override language and
      # no preview host in anything a machine reads; robots.txt lets agents in.
      - name: Agentic primitives (OpenAPI ↔ routes, no injection, no preview hosts)
        run: node scripts/verify-agentic.mjs
      # ── the catch-all, and the reason it exists ───────────────────────────
      #
      # F-183. The steps above are named individually on purpose — a failing
      # step name in the PR checks list tells you what broke before you open a
      # log, and that is worth keeping. What it is NOT is a complete list. On
      # 2026-09-09 this job ran 17 guards. `pnpm verify` ran 54. Thirty-seven
      # guards existed, passed locally when someone remembered to run them, and
      # had never once gated a merge — among them verify:destinations, which
      # was at that moment failing on a real broken link that had already
      # shipped to production.
      #
      # Nobody removed those steps. They were never added, because adding a
      # guard meant editing package.json AND this file, and the second edit is
      # invisible when you forget it.
      #
      # So this step runs every guard the repository has, derived from
      # package.json rather than from a list kept here. The named steps above
      # re-run inside it; that costs about six seconds and is the price of the
      # checks list staying legible. A guard added to package.json now gates
      # this job from its first commit, with no second edit and nothing to
      # remember.
      - name: All guards (derived from package.json — nothing can be left out)
        run: node scripts/verify-all.mjs

  build:
    name: Typecheck & Build
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder values only. next build must not depend on real secrets — if a
    # value here has to become real for the build to pass, that is a bug worth
    # fixing rather than a secret worth adding.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=ecowoods
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=ecowoods
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
      NEXTAUTH_URL: https://ecowoods.ca
      NEXT_PUBLIC_SITE_URL: https://ecowoods.ca
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The one guard in scripts/verify-*.mjs that needs an installed
      # dependency (postcss, which Next already uses to compile globals.css —
      # see scripts/verify-css.mjs). The Guards job stays dependency-free by
      # design and skips this one specifically for that reason; this is where
      # it actually runs, now that node_modules exists.
      - name: CSS parses (postcss, the same parser that compiles it)
        run: node scripts/verify-css.mjs
      # Must precede tsc: the client is generated from schema.prisma, and
      # without it every model added since the last generate is a type error.
      - name: Generate Prisma client
        run: pnpm --filter @ecowoods/web exec prisma generate
      - name: Typecheck
        run: pnpm --filter @ecowoods/web exec tsc --noEmit
      # In-process: the registry, the matcher and the /api/v1 handlers are
      # exercised with real Request objects and no server. Contract, negative,
      # invariant and drift suites — a fact that differs between two surfaces
      # fails here before the build spends two minutes on it.
      - name: Unit and contract tests
        run: pnpm --filter @ecowoods/web test
      - name: Production build
        run: pnpm --filter @ecowoods/web build
