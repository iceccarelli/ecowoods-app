name: Backend

# Path-gated: these only run when backend/ actually changes.
#
# Previously they ran on EVERY push, including pure frontend and content
# commits — six checks (Docker build, ruff, black, bandit, and a three-version
# pytest matrix) for a FastAPI service that Vercel does not deploy. Meanwhile
# apps/web, the thing customers load, had no build check at all.
#
# The matrix is one version now: backend/Dockerfile pins python:3.12-slim, so
# testing 3.11 and 3.13 gated merges on runtimes that never ship.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ecowoods-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify docker-compose config
        run: docker compose config --quiet

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff black
      - name: Ruff lint
        run: ruff check backend/ --config backend/pyproject.toml
      - name: Black format check
        run: black --check --config backend/pyproject.toml backend/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit[toml]"
      - name: Run bandit
        run: bandit -r backend/app/ -c backend/pyproject.toml

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "sqlite+aiosqlite://"
      DATABASE_URL_SYNC: "sqlite://"
      SECRET_KEY: ci-test-secret-key-not-for-production
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short -p no:cacheprovider
