name: Lighthouse CI
on:
  # Manual runs measure main without needing a pull request.
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @ecowoods/web build
        env:
          # Build needs a DB URL for prisma generate; a dummy is fine for static build.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      - name: Run Lighthouse CI
        run: |
          pnpm add -g @lhci/cli@0.14.x
          cd apps/web && lhci autorun
      # Phones are where the estimate form is filled in. The desktop run above
      # never saw the estimate path on a mobile profile or any per-metric
      # budget; this run uses Lighthouse's default mobile emulation and only
      # warns, so it measures without blocking.
      - name: Run Lighthouse CI (mobile, warn-only)
        continue-on-error: true
        run: cd apps/web && lhci autorun --config=./lighthouserc.mobile.json
      # The assertion output names failed thresholds only; this prints the LCP
      # element, heaviest requests and script time of the median run per URL so
      # the numbers can be read from the log.
      - name: Lighthouse measurements (median run per URL)
        if: always()
        continue-on-error: true
        run: node scripts/lhci-summary.mjs apps/web/.lighthouseci
