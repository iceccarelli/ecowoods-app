version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      npm-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Toronto
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      python-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Toronto
    labels: ["dependencies"]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /services/render-api
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Toronto
    labels: ["dependencies"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Toronto
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: ci
    groups:
      actions-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
