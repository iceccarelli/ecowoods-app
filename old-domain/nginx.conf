# =============================================================================
# ECOWOODS — ecowoodshardwood.com → ecowoods.ca
#
# GENERATED FILE. Do not edit.
#   source:   old-domain/path-map.json
#   generator: scripts/build-old-domain-redirects.mjs
#   run:      pnpm domain:build
#
# Inventory measured 2026-08-24 from https://www.ecowoodshardwood.com/sitemap.xml — 36 URLs.
#
# NOT PATH-PRESERVING, AND THAT IS DELIBERATE. The two sites share no
# paths at all: the old one serves /pages/… and /blogs/… from a hosted
# store platform. A path-preserving rule turns every live URL into a 404
# on the new domain, which is worse than the 404 it already returns.
#
# 301, never 302. A 302 tells a crawler to keep the OLD url indexed,
# which is the opposite of consolidating two domains into one.
#
# ONE HOP. There is no separate HTTPS-forcing rule: the destination is
# already https, and forcing the scheme first is what turns one redirect
# into two. Every combination of scheme and host lands in a single 301.
# =============================================================================

server {
  listen 80;
  listen 443 ssl http2;
  server_name ecowoodshardwood.com www.ecowoodshardwood.com;

  # TLS must keep renewing on this host. A redirect that fails its
  # certificate is a redirect browsers refuse to follow, and the failure
  # looks like the site is gone rather than moved.
  # ssl_certificate     /etc/letsencrypt/live/ecowoodshardwood.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/ecowoodshardwood.com/privkey.pem;

  # Leftover store-platform endpoints listed in the old sitemap. There is no store on ecowoods.ca; nothing corresponds. They go to the front door rather than to a 404.
  if ($query_string ~ "fuseaction=store\.(terms|returns|shipping)") {
    return 301 https://ecowoods.ca/;
  }

  # 22 individual customer testimonials plus their index. /reviews is where this site sends anyone asking about reputation, and it explains why the reviews live on platforms we cannot edit.
  location ~ "^/blogs/testimonials(/.*)?$" { return 301 https://ecowoods.ca/reviews; }

  # The old blog index and its three posts. Two of the three are 'announcing the new website' and 'new website under construction', which is its own argument for consolidating.
  location ~ "^/blogs/ecowoods-hardwood-flooring-blog(/.*)?$" { return 301 https://ecowoods.ca/blog; }

  # Nav label: Testimonials.
  location ~ "^/pages/ecowoods-hardwood-flooring-testimonials-toronto-etobicoke/?$" { return 301 https://ecowoods.ca/reviews; }

  # Nav label: About.
  location ~ "^/pages/ecowoods-hardwood-flooring-contractors-toronto-etobicoke-hamilton/?$" { return 301 https://ecowoods.ca/about; }

  # Nav label: Services. Its H1 is 'Flooring Services in Greater Toronto Area' and it lists installation, refinishing, repair and stair refinishing — the same six services /services indexes, now with published price bands.
  location ~ "^/pages/flooring-services-toronto-etobicoke-hamilton/?$" { return 301 https://ecowoods.ca/services; }

  # Nav label: CONTACT. The slug describes services and the page is the contact form — which is exactly why this map was built from the navigation rather than from the slugs.
  location ~ "^/pages/hardwood-floor-installation-and-refinishing-toronto-etobicoke-hamilton/?$" { return 301 https://ecowoods.ca/#quote; }

  # Nav label: Home.
  location ~ "^/pages/home/?$" { return 301 https://ecowoods.ca/; }

  # The old site published one. So must this one — see the note in apps/web/app/privacy/page.tsx about the four places that linked to /privacy while it 404ed.
  location ~ "^/privacy-policy/?$" { return 301 https://ecowoods.ca/privacy; }

  # Root to root. This page is titled 'Portfolio | Hardwood Floor Repair in Toronto, Vaughan, Markham' and its body says 'Coming soon...', so /case-studies is arguably the better content match — but a person typing the bare domain wants the company, and the company's front door is the front door. The repair-query equity it holds is picked up by /hardwood-floor-problems-toronto through the site's own internal linking, not by pointing a domain root at a subpage.
  location ~ "^/$" { return 301 https://ecowoods.ca/; }

  # Fallback.
  # Anything not matched above.
  # Google treats a mass redirect of irrelevant URLs to the homepage as a soft
  # 404, and that is a real cost — but it is the lesser one here. The
  # alternative is path-preservation, which for this pair of sites produces a
  # guaranteed hard 404 on every single URL, because the two share no paths at
  # all. A soft landing on a page about the same business beats a dead end.
  # The way to shrink this fallback is to add rules above it, not to change it.
  location / { return 301 https://ecowoods.ca/; }
}
