<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="4in" viewBox="0 0 600 400" role="img" aria-label="Leave a review for Ecowoods at ecowoods.ca slash r">
  <title>Ecowoods — review card</title>
  <desc>Printable 6x4 inch leave-behind for every completed job. The QR encodes https://ecowoods.ca/r and was verified by decoding it out of this finished artwork at 1200, 800 and 600px wide (it stops decoding around 480px, which is a 2in-wide render of a 6in card and far below any real scan). Do not recolour the code, shrink it below this size, or reduce its quiet zone.</desc>
  <rect width="600" height="400" fill="#faf6ef"/>
  <rect x="0" y="0" width="600" height="7" fill="#c87e4f"/>

  <text x="44" y="80" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#3d2b1f">Your floor is finished.</text>
  <text x="44" y="116" font-family="Georgia,'Times New Roman',serif" font-size="30" fill="#3d2b1f">Tell the truth about it.</text>

  <text x="44" y="160" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c4636">Good or bad, we would rather have it</text>
  <text x="44" y="180" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c4636">written somewhere we cannot edit it.</text>
  <text x="44" y="200" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c4636">Scan, pick a platform, say what</text>
  <text x="44" y="220" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#5c4636">actually happened. About a minute.</text>

  <text x="44" y="268" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#a56034">ecowoods.ca/r</text>

  <line x1="44" y1="300" x2="556" y2="300" stroke="#e0d5c6" stroke-width="1"/>
  <text x="44" y="326" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#7a6252">No incentive. No discount. No filtering. Every completed job gets this card,</text>
  <text x="44" y="344" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#7a6252">and every review goes wherever you choose to put it.</text>
  <text x="44" y="374" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#3d2b1f">Ecowoods Hardwood Flooring Inc.</text>

